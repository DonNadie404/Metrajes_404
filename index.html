<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Metrajes_404 — Home</title>
  <!-- Retro / slightly unnerving font for the brand -->
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">Metrajes_404</div>

      <form id="searchForm" class="search" onsubmit="return false;">
        <input id="searchInput" type="search" placeholder="Search" aria-label="Search videos" />
        <button id="searchBtn">Search</button>
      </form>

      <nav class="userlinks">
        <a href="#">Upload</a>
        <a href="#">Sign in</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="videos-grid" id="videosGrid">
      <!-- Video cards are rendered by script.js -->
    </section>
  </main>

  <!-- Modal player -->
  <div id="videoModal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-label="Video player">
      <button id="closeModal" class="close">×</button>
      <div class="modal-body">
        <iframe id="modalPlayer" width="800" height="450" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        <h3 id="modalTitle"></h3>
        <div id="modalFoundBy" class="modal-foundby"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
